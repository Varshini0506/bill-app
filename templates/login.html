<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill App - Login</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.jpeg') }}" type="image/jpeg">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .login-header h2 {
            color: #005703;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-header p {
            color: #666666;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #005703;
            box-shadow: 0 0 0 3px rgba(0, 87, 3, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #005703;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #003f02;
        }

        .error-message {
            background-color: #fde8e8;
            color: #c53030;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='icon.jpeg') }}" alt="Logo">
            <h2>Bill App</h2>
            <p>Please enter your credentials to login</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;
            const errorDiv = document.getElementById("error-message");

            errorDiv.style.display = "none";
            errorDiv.textContent = "";

            fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect || "/billing";
                } else {
                    errorDiv.textContent = data.error || "Invalid username or password";
                    errorDiv.style.display = "block";
                }
            })
            .catch(err => {
                console.error("Login error:", err);
                errorDiv.textContent = "Invalid username or password";
                errorDiv.style.display = "block";
            });
        }
    </script>

</body>
</html>
